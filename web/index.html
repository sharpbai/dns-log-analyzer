<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS Observability</title><style>body{background:#0b1220;color:#dce6f2;font:14px ui-monospace,Menlo,monospace;max-width:1050px;margin:25px auto;padding:12px}h1{font-size:22px}h2{font-size:14px;color:#78d4f2}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#152233;border:1px solid #34475d;border-radius:10px;padding:18px}.wide{grid-column:1/-1}.metrics{display:flex;gap:30px}.big{font-size:28px;color:#79e5ad;font-weight:bold}button{background:#1b3449;color:#dce6f2;border:1px solid #47647c;border-radius:5px;padding:8px;cursor:pointer}button.active{background:#285f74}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #324357;text-align:right}td:first-child,th:first-child{text-align:left}.muted{color:#9bacbd}footer{margin-top:15px;color:#9bacbd;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}.wide{grid-column:auto}.metrics{gap:12px}.big{font-size:22px}}</style><h1>DNS OBSERVABILITY <small class="muted">local-57 · READ ONLY</small></h1><nav><button data-p="today" class="active">Today</button> <button data-p="yesterday">Yesterday</button> <button data-p="week">Week</button> <button data-p="month">Month</button> <button data-p="last7">Last 7d</button> <button id="refresh">↻</button></nav><p id="state" class="muted">加载中…</p><main class="cards"><section class="card"><h2>01 / DNSMASQ</h2><div class="metrics"><div>确认成功率<div class="big" id="confirmed">—</div></div><div>全量完成成功率<div class="big" id="overall">—</div></div></div><div id="masq"></div></section><section class="card"><h2>02 / DNSPROXY</h2><div id="proxy"></div></section><section class="card wide"><h2>03 / UPSTREAM HEALTH</h2><div style="overflow:auto"><table><thead><tr><th>上游</th><th>成功率</th><th>P50</th><th>P95</th><th>P99</th><th>≥3s</th></tr></thead><tbody id="upstreams"></tbody></table></div></section></main><footer>单上游交换延迟不等于客户端最终延迟。只读统计，无配置修改。快照时间：<span id="updated">—</span></footer><script>const $=x=>document.getElementById(x),fmt=x=>x==null?'N/A':Number(x).toLocaleString(),pct=x=>x==null?'N/A':Number(x).toFixed(2)+'%',ms=x=>x==null?'—':Math.round(x)+'ms';let period='today';function line(k,v){let d=document.createElement('p');d.style.display='flex';d.style.justifyContent='space-between';let a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;d.append(a,b);return d}async function load(){try{$('state').textContent='正在读取 '+period;let r=await fetch('data/'+period+'.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),m=d.dnsmasq,p=d.dnsproxy;$('confirmed').textContent=pct(m.confirmed_success_rate);$('overall').textContent=pct(m.overall_success_rate);$('masq').replaceChildren(...[['查询',fmt(m.total)],['成功',fmt(m.success)],['失败',fmt(m.failed)],['未确认',fmt(m.unconfirmed)],['重复',fmt(m.duplicate)],['完整缓存命中',pct(m.cache_hit_rate)]].map(x=>line(...x)));$('proxy').replaceChildren(...[['请求事件',fmt(p.packet_events)],['缓存事件',fmt(p.cache_events)],['事件比例',pct(p.cache_event_ratio)]].map(x=>line(...x)));$('upstreams').replaceChildren();for(let u of p.upstreams){let tr=document.createElement('tr');for(let v of [u.name,pct(u.success_rate),ms(u.p50),ms(u.p95),ms(u.p99),fmt(u.over_3s)]){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('upstreams').append(tr)}$('updated').textContent=d.generated_at||d.window.end;$('state').textContent=d.window.start+' → '+d.window.end}catch(e){$('state').textContent='数据尚不可用：'+e.message}}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x===b));load()});$('refresh').onclick=load;load();setInterval(load,60000)</script></html>
