<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>DNS Observability</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;background:#0b1220;color:#e2eaf5}
*{box-sizing:border-box}body{margin:0;max-width:1100px;padding:24px;margin-inline:auto}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:21px;letter-spacing:.01em;margin:0 0 5px}h2{font-size:12px;letter-spacing:.09em;color:#7ad6ef;margin:0 0 15px}
.muted{color:#95a6bb;font-size:12px}.status{margin:14px 0 16px;line-height:1.5;overflow-wrap:anywhere}
.controls{display:flex;gap:6px;flex-wrap:wrap}button{min-height:40px;padding:8px 13px;background:#1c2e42;color:#dce8f4;border:1px solid #34485d;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}button.active{background:#23556b;border-color:#67bddb;color:#e9faff}button:focus-visible{outline:2px solid #7ad6ef}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#142033;border:1px solid #314357;border-radius:13px;padding:19px;min-width:0}.wide{grid-column:1/-1}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:13px}.metric-label{color:#a5b5c8;font-size:12px}.big{font-size:30px;letter-spacing:-.04em;font-weight:700;color:#7fe1ae;margin-top:5px;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid #28384b;padding:9px 0;font-size:13px}.line:last-child{border:0}.line span:first-child{color:#a5b5c8}.line b{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:12px}th{color:#a5b5c8;font-weight:500}td,th{padding:11px 8px;text-align:right;border-bottom:1px solid #2b3c50;font-variant-numeric:tabular-nums}td:first-child,th:first-child{text-align:left}td:first-child{overflow-wrap:anywhere}
.upstream-cards{display:none}.upstream-card{padding:12px 0;border-bottom:1px solid #304155}.upstream-card:last-child{border:0}.upstream-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:13px}.upstream-name{overflow-wrap:anywhere;min-width:0}.upstream-rate{color:#80e3b0;font-weight:700;white-space:nowrap}.latency{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}.latency div{background:#1c3046;padding:9px 5px;border-radius:8px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px}.latency small{display:block;color:#9bacc1;font-size:10px;margin-bottom:4px}
footer{font-size:11px;line-height:1.7;color:#9cacc0;margin:16px 0;padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:700px){body{padding:16px 12px 22px}header{display:block}h1{font-size:19px}.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:14px;gap:5px}.controls button{padding:8px 3px;font-size:11px;min-height:42px}.controls #refresh{grid-column:1/-1;min-height:36px}.grid{grid-template-columns:1fr;gap:11px}.panel{padding:15px;border-radius:12px}.wide{grid-column:auto}.big{font-size:27px}.upstream-table{display:none}.upstream-cards{display:block}.status{font-size:11px}.metrics{gap:8px}.metric-label{font-size:11px}}
</style></head><body>
<header><div><h1>DNS OBSERVABILITY</h1><div class="muted">local-57 · 只读监控 · 北京时间</div></div>
<nav class="controls" aria-label="统计周期"><button data-p="today" class="active">今天</button><button data-p="yesterday">昨天</button><button data-p="week">本周</button><button data-p="month">本月</button><button data-p="last7">近7天</button><button id="refresh" aria-label="刷新数据">↻ 刷新</button></nav></header>
<p id="state" class="status muted" aria-live="polite">正在加载数据…</p>
<main class="grid"><section class="panel"><h2>01 / DNSMASQ · 解析结果</h2><div class="metrics"><div><div class="metric-label">确认成功率</div><div class="big" id="confirmed">—</div></div><div><div class="metric-label">全量完成成功率</div><div class="big" id="overall">—</div></div></div><div id="masq"></div></section>
<section class="panel"><h2>02 / DNSPROXY · 缓存</h2><div id="proxy"></div></section>
<section class="panel wide"><h2>03 / UPSTREAM · 上游性能</h2><div class="upstream-table"><table><thead><tr><th>上游</th><th>成功率</th><th>P50</th><th>P95</th><th>P99</th><th>≥3s</th></tr></thead><tbody id="upstreams"></tbody></table></div><div id="upstream-cards" class="upstream-cards"></div></section></main>
<footer>单上游耗时不等于客户端最终解析耗时；未确认请求不计为成功。<div>快照生成：<span id="updated">—</span></div></footer>
<script>
const $=id=>document.getElementById(id),num=v=>v==null?'N/A':Number(v).toLocaleString('zh-CN'),pct=v=>v==null?'N/A':Number(v).toFixed(2)+'%',ms=v=>v==null?'—':Math.round(v)+' ms';
const beijing=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dateText=s=>{if(!s)return '—';const d=new Date(s);return Number.isNaN(d.getTime())?s:beijing.format(d)+' 北京时间'};
const windowText=s=>{if(!s)return '—';return s.replace('T',' ').slice(0,19)+' 北京时间'};
let period='today';
function line(k,v){const el=document.createElement('div');el.className='line';const a=document.createElement('span'),b=document.createElement('b');a.textContent=k;b.textContent=v;el.append(a,b);return el}
function upstreamName(name){return name.replace('https://cloudflare-dns.com:443/dns-query','Cloudflare DoH').replace('https://dns.google:443/dns-query','Google DoH').replace('1.1.1.1:53','Cloudflare UDP').replace('8.8.8.8:53','Google UDP')}
async function load(){const state=$('state');state.textContent='正在读取 '+period+' 快照…';try{
 const r=await fetch('data/'+period+'.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);
 const d=await r.json(),m=d.dnsmasq,p=d.dnsproxy;
 $('confirmed').textContent=pct(m.confirmed_success_rate);$('overall').textContent=pct(m.overall_success_rate);
 $('masq').replaceChildren(...[['查询总数',num(m.total)],['成功',num(m.success)],['明确失败',num(m.failed)],['未确认完成',num(m.unconfirmed)],['重复请求',num(m.duplicate)],['完整缓存命中率',pct(m.cache_hit_rate)]].map(x=>line(...x)));
 $('proxy').replaceChildren(...[['请求事件',num(p.packet_events)],['缓存事件',num(p.cache_events)],['缓存事件比例',pct(p.cache_event_ratio)]].map(x=>line(...x)));
 const body=$('upstreams'),cards=$('upstream-cards');body.replaceChildren();cards.replaceChildren();
 for(const u of p.upstreams){const name=upstreamName(u.name),values=[name,pct(u.success_rate),ms(u.p50),ms(u.p95),ms(u.p99),num(u.over_3s)];
 const tr=document.createElement('tr');for(const v of values){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr);
 const card=document.createElement('div');card.className='upstream-card';const head=document.createElement('div');head.className='upstream-head';const label=document.createElement('strong');label.className='upstream-name';label.textContent=name;const rate=document.createElement('span');rate.className='upstream-rate';rate.textContent=pct(u.success_rate);head.append(label,rate);card.append(head);
 const latency=document.createElement('div');latency.className='latency';for(const [key,value] of [['P50',ms(u.p50)],['P95',ms(u.p95)],['P99',ms(u.p99)],['≥3s',num(u.over_3s)]]){const item=document.createElement('div'),small=document.createElement('small');small.textContent=key;item.append(small,document.createTextNode(value));latency.append(item)}card.append(latency);cards.append(card)}
 $('updated').textContent=dateText(d.generated_at);
 state.textContent='统计窗口：'+windowText(d.window.start)+' → '+windowText(d.window.end);
 }catch(e){state.textContent='数据暂不可用：'+e.message+'（保留上次显示）'}}
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{period=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x===b));load()}));
$('refresh').addEventListener('click',load);load();setInterval(load,60000);
</script></body></html>
